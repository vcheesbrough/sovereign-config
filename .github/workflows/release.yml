# Release workflow: gives each deployed version a GitHub Release that links its
# images (card #550). A version's git tag is written by its first deploy — the
# Woodpecker deploys' `tag` step — and that tag push runs this workflow, which
# creates the Release: the three GHCR images at that version, each with its
# digest and package page. A tag whose commit main does not contain (a branch
# deployed to dev) becomes a pre-release, never "latest".
#
# A manual run takes an existing tag and rewrites its Release, which is how
# tags pushed before this workflow existed get one. Nothing here creates, moves
# or deletes a tag (release-flow): `gh release create --verify-tag` refuses a
# tag that does not exist.

name: release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag, e.g. 2.49.3
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # scripts/ci-release.sh refuses anything but MAJOR.MINOR.PATCH.
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/ci-release.sh "$TAG" "$GITHUB_REPOSITORY" ghcr.io/vcheesbrough/sovereign-config ghcr.io/vcheesbrough/sovereign-config-woodpecker-broker ghcr.io/vcheesbrough/sovereign-config-cli
