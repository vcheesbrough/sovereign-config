when:
  - event: [push, pull_request]

steps:
  verify-rust:
    image: docker.io/library/rust@sha256:cf9dd0ec73e75f827fe59123fff9dc65af1a1c8363c3c31ee8d7f8ad0b6a5fb2
    commands:
      - rustup component add clippy rustfmt
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  verify-compose:
    image: docker.io/library/docker@sha256:862099ada15c669000bef53aa4cb9d821262829f45b0dda2159ccb276443043b
    commands:
      - SOVEREIGN_CONFIG_IMAGE='zot.example.internal/sovereign-config/server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' SOVEREIGN_CONFIG_HOST=config.example.internal POSTGRES_PASSWORD_FILE=/dev/null DATABASE_URL_FILE=/dev/null docker compose config -q

  verify-image:
    image: woodpeckerci/plugin-docker-buildx@sha256:93e8c7b4480899ecea64a5e023abd2ce0f5bd134d22455cb2354c3ed7d48af93
    settings:
      dry_run: true
      dockerfile: Dockerfile
      platforms: linux/amd64
      repo: vcheesbrough/sovereign-config
