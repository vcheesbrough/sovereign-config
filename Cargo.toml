[workspace]
members = [
  "crates/sovereign-config-client",
  "crates/sovereign-config-cli",
  "crates/sovereign-config-core",
  "crates/sovereign-config-layers",
  "crates/sovereign-config-mcp",
  "crates/sovereign-config-native",
  "crates/sovereign-config-proto",
  "crates/sovereign-config-provider",
  "crates/sovereign-config-server",
  "crates/sovereign-config-telemetry",
  "crates/sovereign-config-web",
  "crates/sovereign-config-woodpecker-broker",
  "test-consumers/render-consumer",
  "test-consumers/rust-client",
  "test-consumers/rust-provider",
  "test-consumers/sovereign-config-proto-testversion",
]
resolver = "2"

[workspace.package]
version = "2.36.0"
edition = "2024"
rust-version = "1.94"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/vcheesbrough/sovereign-config"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.6"
base64 = "0.22.1"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
getrandom = "0.3.4"
http = "1.4.0"
http-body-util = "0.1.4"
js-sys = "0.3.103"
mime_guess = "2.0.5"
prost = "0.13.5"
prost-types = "0.13.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rust-embed = "8.11.0"
rustix = { version = "1.1.3", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
toml = "1.1.3"
thiserror = "2.0.17"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time"] }
time = "0.3.44"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.12.3", default-features = false, features = ["codegen", "prost"] }
tonic-health = "0.12.3"
tonic-web = "0.12.3"
tower = { version = "0.4.13", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.8"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
uuid = { version = "1.26.1", features = ["v5"] }

# Telemetry — one set, moved as one (`observability` skill, references/rust.md).
#
# The core family (`opentelemetry`, `_sdk`, `-otlp`, `-appender-tracing`,
# `-http`, `-semantic-conventions`) releases together under one number;
# `tracing-opentelemetry` has its own number and lags. It sets the pace: the
# core is pinned to the `opentelemetry` requirement of the newest
# `tracing-opentelemetry` release, never inferred from version numbers. On
# 2026-09-28 that was `tracing-opentelemetry` 0.34.0, requiring core 0.33;
# spans (#420) added it at exactly that version (re-verified on crates.io:
# `tracing-opentelemetry` 0.34.0 requires `opentelemetry` ^0.33.0).
#
# Only `sovereign-config-telemetry` may depend on `_sdk`, `-otlp`,
# `-appender-tracing` or `tracing-opentelemetry` (its allowlist test enforces
# the source side). `-http` is the header carrier for inject and extract,
# wrapped by the telemetry crate's `context` module. Not in the set, deliberately: `prometheus`, `metrics`,
# `axum-tracing-opentelemetry`, `reqwest-tracing`.
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "logs"] }
# http/protobuf only, over the blocking reqwest client the SDK's batch thread
# drives. This path already brings second majors of prost (0.14, via
# `opentelemetry-proto`) and reqwest (0.13) beside the server's 0.13 and 0.12;
# that was accepted. `grpc-tonic` is left out because it would add a second
# tonic as well, and needs an async-runtime batch processor, for a transport
# this estate's collector does not need.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs", "trace", "internal-logs"] }
opentelemetry-appender-tracing = { version = "0.33.0", default-features = false }
opentelemetry-semantic-conventions = "0.33.0"
opentelemetry-http = { version = "0.33.0", default-features = false }
# Spans only: its `metrics` feature is #421's to decide, and `tracing-log`
# would turn `log` records into a second path for the same events.
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
