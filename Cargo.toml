[workspace]
members = [
  "crates/sovereign-config-proto",
  "crates/sovereign-config-server",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.94"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/vcheesbrough/sovereign-config"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
prost = "0.13.5"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.12.3", features = ["tls", "transport"] }
tonic-health = "0.12.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
