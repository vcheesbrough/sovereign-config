# Build workflow: compute the release tag, then build and push all three
# images under it, in parallel with checks. An image is pushed the moment it is
# built, so no step ever re-reads a local image another pipeline could have
# replaced. Pushing an image does not release it: nothing deploys an image
# whose version is not a git tag, and publish pushes that tag only after every
# check has passed. An image from a pipeline whose checks failed stays in the
# registry, unreleased.
#
# Three images, one semver — each built from its own docker/<image>.Dockerfile,
# which builds only what that image ships, and labelled with the release tag
# and commit.
# See checks.yml for how the workflows fit together.

when:
  - event: [push, manual]

steps:
  # The release tag is Cargo's major.minor plus this pipeline's number as the
  # patch (scripts/ci-release-tag.sh): nothing to allocate, nothing to race,
  # and build and publish derive the same tag. ONLY on a push or manual run: a
  # deployment is its own pipeline, so computing there would name a version
  # that was never built. Deployments resolve the commit's existing tag via
  # resolve-release-tag instead (mirrors bored card #254).
  compute-version:
    when:
      - event: [push, manual]
    depends_on: []
    image: docker.io/alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
    commands:
      - sh scripts/ci-release-tag.sh Cargo.toml > .release-tag
      - echo "Release $$(cat .release-tag)"

  # Bounds this repository's BuildKit cargo target cache mount, which the image
  # builds compile into and nothing else on the host prunes. Only the
  # sovereign-config-cargo-target mount is measured or removed, never another
  # repository's cache. It never fails the build. Runs before both image builds.
  prune-build-cache:
    depends_on: []
    when:
      - event: [push, manual]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - sh scripts/ci-prune-buildkit-cache.sh

  build-server:
    depends_on:
      - compute-version
      - prune-build-cache
    when:
      - event: [push, manual]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/sovereign-config:$$RELEASE_TAG
        docker build --platform linux/amd64 -f docker/server.Dockerfile --build-arg RELEASE_VERSION="$$RELEASE_TAG" --build-arg REVISION="$$CI_COMMIT_SHA" --label org.opencontainers.image.title=sovereign-config --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 --label org.opencontainers.image.url=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/sovereign-config/blob/main/README.md --label org.opencontainers.image.version="$$RELEASE_TAG" --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" --label org.opencontainers.image.source=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag "$$IMAGE" .
        docker image inspect "$$IMAGE" >/dev/null
        echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
        docker push "$$IMAGE"

  # The Woodpecker CI secrets extension, published as a second image under the
  # same semver. It compiles only the broker, with no web bundle or server.
  build-broker:
    depends_on:
      - compute-version
      - prune-build-cache
    when:
      - event: [push, manual]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/sovereign-config-woodpecker-broker:$$RELEASE_TAG
        docker build --platform linux/amd64 -f docker/broker.Dockerfile --build-arg RELEASE_VERSION="$$RELEASE_TAG" --label org.opencontainers.image.title=sovereign-config-woodpecker-broker --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 --label org.opencontainers.image.url=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/sovereign-config/blob/main/crates/sovereign-config-woodpecker-broker/README.md --label org.opencontainers.image.version="$$RELEASE_TAG" --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" --label org.opencontainers.image.source=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag "$$IMAGE" .
        docker image inspect "$$IMAGE" >/dev/null
        echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
        docker push "$$IMAGE"

  # The CLI on the docker CLI base, for other repositories' Woodpecker steps
  # (`sovereign-config render -- docker compose …`). The third image of the
  # release, under the same semver.
  build-cli:
    depends_on:
      - compute-version
      - prune-build-cache
    when:
      - event: [push, manual]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/sovereign-config-cli:$$RELEASE_TAG
        docker build --platform linux/amd64 -f docker/cli.Dockerfile --build-arg RELEASE_VERSION="$$RELEASE_TAG" --label org.opencontainers.image.title=sovereign-config-cli --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 --label org.opencontainers.image.url=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/sovereign-config/blob/main/README.md --label org.opencontainers.image.version="$$RELEASE_TAG" --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" --label org.opencontainers.image.source=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag "$$IMAGE" .
        docker image inspect "$$IMAGE" >/dev/null
        echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
        docker push "$$IMAGE"
