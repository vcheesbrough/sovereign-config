# Step DAG: compute-version ∥ contract-validation ∥ compose-validation →
# build-server. Image publication, deployment, and tagging are added only with
# their corresponding release-quality gates.
when:
  - event: [push, manual]

steps:
  compute-version:
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.0@sha256:81a29c3a5785c146b5b3dfd7e0d8e7edb353b72e4e53bdbef4f7e13a88488c59
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  contract-validation:
    depends_on: []
    image: docker.io/library/rust@sha256:cf9dd0ec73e75f827fe59123fff9dc65af1a1c8363c3c31ee8d7f8ad0b6a5fb2
    commands:
      - rustup component add clippy rustfmt
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  compose-validation:
    depends_on: []
    image: docker.io/library/docker@sha256:862099ada15c669000bef53aa4cb9d821262829f45b0dda2159ccb276443043b
    commands:
      - SOVEREIGN_CONFIG_IMAGE='zot.example.internal/sovereign-config/server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' SOVEREIGN_CONFIG_HOST=config.example.internal POSTGRES_PASSWORD_FILE=/dev/null DATABASE_URL_FILE=/dev/null docker compose config -q

  build-server:
    depends_on:
      - compute-version
      - contract-validation
      - compose-validation
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=sovereign-config-ci:$$CI_COMMIT_SHA
        docker build --platform linux/amd64 +          --label org.opencontainers.image.title=sovereign-config +          --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 +          --label org.opencontainers.image.url=https://github.com/vcheesbrough/sovereign-config +          --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/sovereign-config/blob/main/README.md +          --label org.opencontainers.image.version="$$RELEASE_TAG" +          --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" +          --label org.opencontainers.image.source=https://github.com/vcheesbrough/sovereign-config +          --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" +          --tag "$$IMAGE" .
        docker image inspect "$$IMAGE" >/dev/null
