# Step DAG: compute-version → build-server ┐
# workspace-validation ∥ browser-validation ┴→ publish-dev-image →
# validate-authentik-version → apply-authentik-blueprint-auto-dev →
# auto-deploy-dev → tag-release-auto-dev.
when:
  - event: [push, manual]

steps:
  compute-version:
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.0@sha256:81a29c3a5785c146b5b3dfd7e0d8e7edb353b72e4e53bdbef4f7e13a88488c59
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  workspace-validation:
    depends_on: []
    image: docker.io/library/rust@sha256:cf9dd0ec73e75f827fe59123fff9dc65af1a1c8363c3c31ee8d7f8ad0b6a5fb2
    environment:
      CARGO_TARGET_DIR: /woodpecker/cache/sovereign-config-target
      SOVEREIGN_CONFIG_TEST_DATABASE_URL: postgresql://sovereign_config_test:sovereign_config_test@postgres-test:5432/sovereign_config_test
    volumes:
      - sovereign-config-cargo-registry:/usr/local/cargo/registry
      - sovereign-config-cargo-git:/usr/local/cargo/git
      - sovereign-config-contract-target:/woodpecker/cache/sovereign-config-target
    commands:
      - rustup component add clippy rustfmt
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace
      - cargo test --package sovereign-config-server -- --ignored --test-threads=1
      - rustup target add wasm32-unknown-unknown
      - cargo check --target wasm32-unknown-unknown --package sovereign-config-core --package sovereign-config-client --package sovereign-config-web

  browser-validation:
    depends_on: []
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        rm -rf .browser-dist
        docker build --target web-dist-artifact --output type=local,dest=.browser-dist .
        CONTAINER=$$(docker create --workdir /tests \
          --env PLAYWRIGHT_STATIC=1 \
          --env PLAYWRIGHT_STATIC_DIR=/web-dist \
          mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48 \
          sh -lc 'npm ci --ignore-scripts && npm test')
        trap 'docker rm --force "$$CONTAINER" >/dev/null 2>&1 || true; rm -rf .browser-dist' EXIT
        docker cp browser-tests/. "$$CONTAINER:/tests"
        docker cp test-contracts/. "$$CONTAINER:/test-contracts"
        docker cp .browser-dist/. "$$CONTAINER:/web-dist"
        docker start --attach "$$CONTAINER"

  build-server:
    depends_on:
      - compute-version
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=sovereign-config-ci:$$CI_COMMIT_SHA
        docker build --platform linux/amd64 --build-arg RELEASE_VERSION="$$RELEASE_TAG" --label org.opencontainers.image.title=sovereign-config --label org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0 --label org.opencontainers.image.url=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.documentation=https://github.com/vcheesbrough/sovereign-config/blob/main/README.md --label org.opencontainers.image.version="$$RELEASE_TAG" --label org.opencontainers.image.revision="$$CI_COMMIT_SHA" --label org.opencontainers.image.source=https://github.com/vcheesbrough/sovereign-config --label org.opencontainers.image.created="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag "$$IMAGE" .
        docker image inspect "$$IMAGE" >/dev/null

  publish-dev-image:
    depends_on:
      - build-server
      - workspace-validation
      - browser-validation
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/sovereign-config:$$RELEASE_TAG
        echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
        docker tag sovereign-config-ci:$$CI_COMMIT_SHA "$$IMAGE"
        docker push "$$IMAGE"

  apply-authentik-blueprint-auto-dev:
    depends_on:
      - validate-authentik-version
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-dev.yaml
      instance_name: sovereign-config-dev
      timeout_seconds: 900
      vars:
        AUTHENTIK_SOVEREIGN_CONFIG_DEV_INTROSPECTION_CLIENT_SECRET:
          from_secret: sovereign_config_dev_oidc_introspection_client_secret
        AUTHENTIK_SOVEREIGN_CONFIG_DEV_MANAGER_API_TOKEN:
          from_secret: sovereign_config_dev_manager_api_token
        SOVEREIGN_CONFIG_DEV_BROWSER_REDIRECT_URI: https://sovereign-config-dev.desync.link/auth/callback
        AUTHENTIK_DEV_BRAND_DOMAIN: auth.desync.link

  validate-authentik-version:
    depends_on:
      - publish-dev-image
    image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    environment:
      AUTHENTIK_API_TOKEN:
        from_secret: authentik_api_token
    commands:
      - |
        umask 077
        printf 'header = "Authorization: Bearer %s"\n' "$$AUTHENTIK_API_TOKEN" > /tmp/authentik-curl.conf
        VERSION=$$(curl --fail --silent --show-error --config /tmp/authentik-curl.conf https://auth.desync.link/api/v3/admin/version/ | sed -n 's/.*"version_current":"\([^"]*\)".*/\1/p')
        test -n "$$VERSION"
        awk -v version="$$VERSION" 'BEGIN { split(version, part, "."); if (part[1] > 2026 || (part[1] == 2026 && part[2] > 5) || (part[1] == 2026 && part[2] == 5 && part[3] >= 2)) exit 0; exit 1 }'
        curl --fail --silent --show-error --config /tmp/authentik-curl.conf https://auth.desync.link/api/v3/schema/ > /tmp/authentik-schema.json
        grep -q 'grant_types' /tmp/authentik-schema.json
        # Surfaces required by managed application connections.
        grep -q '/core/users/service_account/' /tmp/authentik-schema.json
        grep -q '/core/tokens/{identifier}/set_key/' /tmp/authentik-schema.json
        grep -q 'initial_permissions' /tmp/authentik-schema.json
        echo "Validated compatible Authentik $$VERSION"

  # Exercises the connection manager against the real Authentik RBAC surface,
  # which no mock can reproduce. Runs after the blueprint so the manager
  # identity exists, and gates the deployment so a broken permission model
  # cannot reach the running service.
  validate-authentik-manager-live:
    depends_on:
      - apply-authentik-blueprint-auto-dev
    image: docker.io/library/rust@sha256:cf9dd0ec73e75f827fe59123fff9dc65af1a1c8363c3c31ee8d7f8ad0b6a5fb2
    environment:
      CARGO_TARGET_DIR: /woodpecker/cache/sovereign-config-target
      SOVEREIGN_CONFIG_LIVE_AUTHENTIK_URL: https://auth.desync.link/
      SOVEREIGN_CONFIG_LIVE_AUTHENTIK_TOKEN:
        from_secret: sovereign_config_dev_manager_api_token
      # Elevated credential used only to create and clean up a disposable
      # canary object for the "manager cannot touch objects it didn't create"
      # test; never used to act as the manager under test.
      SOVEREIGN_CONFIG_LIVE_AUTHENTIK_ADMIN_TOKEN:
        from_secret: authentik_api_token
    volumes:
      - sovereign-config-cargo-registry:/usr/local/cargo/registry
      - sovereign-config-cargo-git:/usr/local/cargo/git
      - sovereign-config-contract-target:/woodpecker/cache/sovereign-config-target
    commands:
      - cargo test --package sovereign-config-server live_ -- --ignored --test-threads=1

  auto-deploy-dev:
    depends_on:
      - validate-authentik-manager-live
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      POSTGRES_PASSWORD:
        from_secret: sovereign_config_dev_postgres_password
      OIDC_INTROSPECTION_URL: https://auth.desync.link/application/o/introspect/
      OIDC_ISSUER: https://auth.desync.link/application/o/sovereign-config-dev/
      OIDC_INTROSPECTION_CLIENT_SECRET:
        from_secret: sovereign_config_dev_oidc_introspection_client_secret
      MANAGER_API_TOKEN:
        from_secret: sovereign_config_dev_manager_api_token
    commands:
      - |
        ENCODED_PASSWORD=$$(printf '%s' "$$POSTGRES_PASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../%&/g')
        SOVEREIGN_CONFIG_IMAGE_TAG=$$(cat .release-tag) SOVEREIGN_CONFIG_ENV=dev SOVEREIGN_CONFIG_HOST=sovereign-config-dev.desync.link SOVEREIGN_CONFIG_CONTAINER_NAME=sovereign-config-dev POSTGRES_DATA_VOLUME=sovereign-config-dev-db POSTGRES_PASSWORD_FILE= SOVEREIGN_CONFIG_DATABASE_URL_FILE= SOVEREIGN_CONFIG_DATABASE_URL="postgresql://sovereign_config:$$ENCODED_PASSWORD@postgres:5432/sovereign_config" SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL="$$OIDC_INTROSPECTION_URL" SOVEREIGN_CONFIG_OIDC_ISSUER=https://auth.desync.link/application/o/sovereign-config-dev/ SOVEREIGN_CONFIG_OIDC_AUDIENCE=sovereign-config-dev SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID=sovereign-config-introspection-dev SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET_FILE= SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET="$$OIDC_INTROSPECTION_CLIENT_SECRET" SOVEREIGN_CONFIG_PUBLIC_ORIGIN=https://sovereign-config-dev.desync.link SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE=sovereign_config_dev_grants SOVEREIGN_CONFIG_MANAGER_GROUP=sovereign-config-dev-connections SOVEREIGN_CONFIG_MANAGER_API_TOKEN_FILE= SOVEREIGN_CONFIG_MANAGER_API_TOKEN="$$MANAGER_API_TOKEN" docker compose -p sovereign-config-dev up -d --wait --wait-timeout 90 || {
          docker compose -p sovereign-config-dev logs --tail 200
          exit 1
        }

  tag-release-auto-dev:
    when:
      - event: push
    depends_on:
      - auto-deploy-dev
    pull: true
    image: *version-plugin
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

services:
  postgres-test:
    image: docker.io/library/postgres@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    environment:
      POSTGRES_DB: sovereign_config_test
      POSTGRES_USER: sovereign_config_test
      POSTGRES_PASSWORD: sovereign_config_test
