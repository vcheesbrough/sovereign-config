# Deploy-prod workflow: production is a promotion of a build the GitHub
# Actions workflow (.github/workflows/build.yml) already checked and published
# to GHCR — triggered by Woodpecker's Deploy feature, a `deployment` event
# targeting prod, only from main. Nothing here builds, publishes or allocates
# a version: resolve chooses the build and proves its images are published,
# deploy-prod deploys it (its `migrate` step changes everything outside the
# image, the Authentik blueprint included), and tag records it. The live
# manager tests that gate a promotion ran on the dev deploy of the same
# commit (#615), whose blueprint differs from prod's only in names. Deploy a
# main commit to dev before promoting it here (AGENTS.md; the pipeline does
# not enforce it).
# See anchor.yml for why a push still runs a Woodpecker pipeline.

when:
  - event: deployment
    branch: main
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'

steps:
  # Woodpecker takes a GitHub deployment whose ref is a bare commit as a
  # deployment of main (its GitHub forge sets the branch to the default
  # branch), so `branch: main` alone would let one ship a commit main never
  # had. This refuses any commit main does not contain. It guards against an
  # accident, not an attacker: the deployed commit supplies this file.
  verify-commit-on-main:
    depends_on: []
    when:
      - event: deployment
        branch: main
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        umask 077
        printf 'header = "Authorization: Bearer %s"\n' "$$GITHUB_TOKEN" > /tmp/github-curl.conf
        curl --fail --silent --show-error --config /tmp/github-curl.conf --header 'Accept: application/vnd.github+json' "https://api.github.com/repos/$$CI_REPO/compare/$$CI_COMMIT_SHA...main?per_page=1" > /tmp/compare.json
        if ! grep -q '"behind_by": *0,' /tmp/compare.json; then
          echo "ERROR: main does not contain $$CI_COMMIT_SHA; production deploys only commits on main." >&2
          exit 1
        fi
        echo "main contains $$CI_COMMIT_SHA"

  # Chooses what this deployment ships, and never builds or allocates: the
  # commit's release tag if it was deployed before, else its newest build that
  # .github/workflows/build.yml published (release-flow). It refuses a target
  # or branch outside the plugin's policy — dev from any branch, prod from
  # main — and checks each image's version and revision labels in GHCR, so a
  # commit with no green build fails here, before anything is deployed.
  # All three images must be published: a server without its matching broker
  # would leave CI resolving secrets against a stale extension, and a version
  # without its CLI image is not a whole release for the pipelines that pin it.
  # The images are public, so it needs no registry credentials.
  resolve:
    depends_on: []
    when:
      - event: deployment
        branch: main
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.2.0@sha256:9d5b3541aa143727f8c68c8c8f1d36557d999d3c857c4581be43363c8ff78c94
    settings:
      mode: resolve
      images:
        - ghcr.io/vcheesbrough/sovereign-config
        - ghcr.io/vcheesbrough/sovereign-config-woodpecker-broker
        - ghcr.io/vcheesbrough/sovereign-config-cli
      github_token:
        from_secret: github_token

  # Deploys the build in two phases, so the running server keeps serving
  # unless the new release's state is in place (#615; docs/project-deployment.md,
  # *Migrations*). First `migrate` runs alone: the schema, the identity claim,
  # the stored secrets and the Authentik blueprint, from the image being
  # deployed. Only once it has exited 0 is the server replaced. A plain
  # `up` would replace the server first and leave none running if `migrate`
  # failed, and `up --wait migrate` does not wait for a one-shot service to
  # finish, hence `docker wait`.
  #
  # Every credential reaches its container as a file (compose.yaml,
  # `secrets:`), never as a variable an exited container keeps in `docker
  # inspect`. They are written to a Docker volume of their own, which Compose
  # mounts from the host one file per container; only `migrate` is given the
  # Authentik admin token.
  deploy-prod:
    depends_on:
      - resolve
      - verify-commit-on-main
    when:
      - event: deployment
        branch: main
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sovereign-config-production-secrets:/run/deploy-secrets
    environment:
      POSTGRES_PASSWORD:
        from_secret: sovereign_config_prod_postgres_password
      MANAGER_API_TOKEN:
        from_secret: sovereign_config_prod_manager_api_token
      VALUE_ENCRYPTION_KEY:
        from_secret: sovereign_config_prod_value_encryption_key
      AUTHENTIK_ADMIN_TOKEN:
        from_secret: authentik_api_token
    commands:
      - |
        # Telemetry (docs/project-deployment.md): non-secret, so kept here with the
        # deploy rather than in the store this deploy would have to read itself
        # from. compose.yaml passes the names through.
        #
        # Compose runs as its plugin binary, not as `docker compose`: the
        # docker 27 CLI overwrites OTEL_RESOURCE_ATTRIBUTES with its own
        # `docker.cli.cobra.command_path=…` when it execs a plugin, so the
        # server would lose deployment.environment.name (pipelines 311, 312).
        COMPOSE=/usr/local/libexec/docker/cli-plugins/docker-compose
        export OTEL_SERVICE_NAME=sovereign-config
        export OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=prod,telemetry_source=otlp
        export OTEL_EXPORTER_OTLP_ENDPOINT=http://monitor-alloy:4318
        export OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
        export OTEL_LOGS_EXPORTER=otlp
        export OTEL_TRACES_EXPORTER=otlp
        export OTEL_METRICS_EXPORTER=otlp
        printf 'telemetry: %s\n' "$$OTEL_RESOURCE_ATTRIBUTES"
        # The credentials, as files: written beside and renamed into place,
        # so a running container keeps the file it started with. The server
        # and `migrate` run as 10001; the Postgres entrypoint reads its file
        # as root, before it drops to `postgres`.
        umask 077
        secret() {
          printf '%s' "$$3" > "/run/deploy-secrets/.$$1"
          chown "$$2" "/run/deploy-secrets/.$$1"
          chmod 0400 "/run/deploy-secrets/.$$1"
          mv -f "/run/deploy-secrets/.$$1" "/run/deploy-secrets/$$1"
        }
        ENCODED_PASSWORD=$$(printf '%s' "$$POSTGRES_PASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../%&/g')
        secret postgres_password 0:0 "$$POSTGRES_PASSWORD"
        secret database_url 10001:10001 "postgresql://sovereign_config:$$ENCODED_PASSWORD@postgres:5432/sovereign_config"
        secret manager_api_token 10001:10001 "$$MANAGER_API_TOKEN"
        secret value_encryption_key 10001:10001 "$$VALUE_ENCRYPTION_KEY"
        secret authentik_admin_token 10001:10001 "$$AUTHENTIK_ADMIN_TOKEN"
        unset POSTGRES_PASSWORD ENCODED_PASSWORD MANAGER_API_TOKEN VALUE_ENCRYPTION_KEY AUTHENTIK_ADMIN_TOKEN
        # Compose mounts them from the host, so it is given the volume's host path.
        SECRETS=$$(docker volume inspect --format '{{ .Mountpoint }}' sovereign-config-production-secrets)
        # Exported rather than prefixed, because several Compose runs read them.
        export POSTGRES_PASSWORD_SECRET_FILE="$$SECRETS/postgres_password" DATABASE_URL_FILE="$$SECRETS/database_url" MANAGER_API_TOKEN_FILE="$$SECRETS/manager_api_token" VALUE_ENCRYPTION_KEY_FILE="$$SECRETS/value_encryption_key" AUTHENTIK_ADMIN_TOKEN_FILE="$$SECRETS/authentik_admin_token"
        export SOVEREIGN_CONFIG_IMAGE_TAG=$$(cat .release-tag) SOVEREIGN_CONFIG_ENV=prod SOVEREIGN_CONFIG_HOST=sovereign-config.desync.link SOVEREIGN_CONFIG_CONTAINER_NAME=sovereign-config-production POSTGRES_DATA_VOLUME=sovereign-config-production-db SOVEREIGN_CONFIG_OIDC_ISSUER=https://auth.desync.link/application/o/sovereign-config/ SOVEREIGN_CONFIG_OIDC_AUDIENCE=sovereign-config SOVEREIGN_CONFIG_PUBLIC_ORIGIN=https://sovereign-config.desync.link SOVEREIGN_CONFIG_CLIENT_TELEMETRY_ENDPOINT=https://sovereign-config.desync.link SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE=sovereign_config_prod_grants SOVEREIGN_CONFIG_MANAGER_GROUP=sovereign-config-connections SOVEREIGN_CONFIG_AUTHENTIK_BLUEPRINT=production
        # Phase 1: `migrate`, while the running server goes on serving.
        "$$COMPOSE" -p sovereign-config-prod up -d --pull always migrate || {
          "$$COMPOSE" -p sovereign-config-prod logs --tail 200
          exit 1
        }
        MIGRATE_EXIT=$$(docker wait "$$("$$COMPOSE" -p sovereign-config-prod ps -aq migrate)")
        "$$COMPOSE" -p sovereign-config-prod logs --no-log-prefix migrate
        if [ "$$MIGRATE_EXIT" != 0 ]; then
          echo "ERROR: migrate exited $$MIGRATE_EXIT; the running server was left in place" >&2
          exit 1
        fi
        # Phase 2: the server, which verifies what `migrate` applied.
        "$$COMPOSE" -p sovereign-config-prod up -d --no-deps --wait --wait-timeout 90 sovereign-config || {
          "$$COMPOSE" -p sovereign-config-prod logs --tail 200
          exit 1
        }
        # The web UI's telemetry ingest (compose profile `client-telemetry`),
        # started after the gate above and never part of it: its failure is a
        # warning, not a failed deploy (docs/observability.md).
        "$$COMPOSE" -p sovereign-config-prod --profile client-telemetry up -d --no-deps otlp-ingest || echo "WARNING: the client-telemetry ingest did not start; the deploy continues without it" >&2

  # Records the deploy once it has succeeded: the annotated git tag named by
  # .release-tag, so a tag means "this build was deployed". A no-op when the
  # commit already carries it — a redeploy, or dev then prod — and the plugin
  # refuses a second tag on a commit or a tag that would move. The deployment
  # smoke check runs after the pipeline (AGENTS.md), so it never holds this up.
  tag:
    depends_on:
      - deploy-prod
    when:
      - event: deployment
        branch: main
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "prod"'
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.2.0@sha256:9d5b3541aa143727f8c68c8c8f1d36557d999d3c857c4581be43363c8ff78c94
    settings:
      mode: tag
      github_token:
        from_secret: github_token
