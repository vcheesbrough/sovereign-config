# Publish workflow: once every check has passed and all three images are built,
# push the commit's git tag, then publish the three images under it. Nothing
# here deploys: a dev deployment is a manual Woodpecker Deploy (deploy-dev.yml).
#
# Workflows share nothing, so this workflow computes the release tag again.
# compute-version reuses the tag already on this commit or allocates highest
# remote patch + 1, so it normally matches the tag build used;
# verify-local-images refuses to go on if it does not, before anything is
# tagged — so a commit whose build lost its version to another push is never
# tagged with a version its images do not carry. Re-running it rebuilds and
# allocates afresh.
#
# The tag is pushed before any image. Two publishes that compute the same
# version at once race for the tag, and the release-versions plugin refuses a
# tag that already sits on another commit — so the loser fails at tag-release
# and never overwrites the winner's images in the registry. If publish-image
# fails after the tag is pushed (the registry is down), a re-run reuses the
# commit's tag and publishes under it.
# See checks.yml for how the workflows fit together.

when:
  - event: [push, manual]

# Nothing here starts until every check has passed and all three images are built.
# All three workflows run on push and manual alike, so neither dependency is optional.
depends_on:
  - checks
  - build

steps:
  # Allocates ONE semver per commit — ONLY on a push or manual run, the single
  # place a version is minted. A deployment must NOT run this: it would allocate
  # the *next* patch (an unbuilt tag) and the deploy would pull an image that
  # was never published. Deployments resolve the commit's existing tag via
  # resolve-release-tag instead (mirrors bored card #254).
  compute-version:
    when:
      - event: [push, manual]
    depends_on: []
    pull: true
    image: &version-plugin ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.1.1@sha256:cf74d9706cb42b6d27c8d185789cd814ed061c8c88e06452d33ce3aed0bf9a22
    settings:
      mode: compute
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  # The build workflow made all three images on this Docker host and computed
  # its own release tag. Go on only with images built from this commit for
  # exactly this tag: if another pipeline tagged a release in between, the two
  # tags differ and a binary would ship under another version's name. Runs
  # before tag-release, so a mismatch fails with nothing tagged.
  verify-local-images:
    depends_on:
      - compute-version
    when:
      - event: [push, manual]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        for LOCAL in sovereign-config-ci:$$CI_COMMIT_SHA sovereign-config-woodpecker-broker-ci:$$CI_COMMIT_SHA sovereign-config-cli-ci:$$CI_COMMIT_SHA; do
          LABELS=$$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }} {{ index .Config.Labels "org.opencontainers.image.revision" }}' "$$LOCAL") || {
            echo "ERROR: $$LOCAL was not built on this host" >&2
            exit 1
          }
          if [ "$$LABELS" != "$$RELEASE_TAG $$CI_COMMIT_SHA" ]; then
            echo "ERROR: $$LOCAL is labelled '$$LABELS', expected '$$RELEASE_TAG $$CI_COMMIT_SHA'" >&2
            exit 1
          fi
        done

  tag-release:
    when:
      - event: [push, manual]
    depends_on:
      - verify-local-images
    pull: true
    image: *version-plugin
    settings:
      mode: push-tag
      major_minor_source: cargo
      github_token:
        from_secret: github_token

  publish-image:
    depends_on:
      - tag-release
    when:
      - event: [push, manual]
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        IMAGE=registry.desync.link/sovereign-config:$$RELEASE_TAG
        BROKER_IMAGE=registry.desync.link/sovereign-config-woodpecker-broker:$$RELEASE_TAG
        CLI_IMAGE=registry.desync.link/sovereign-config-cli:$$RELEASE_TAG
        # verify-local-images has proved these are this commit's images for
        # exactly this tag.
        echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
        docker tag sovereign-config-ci:$$CI_COMMIT_SHA "$$IMAGE"
        docker push "$$IMAGE"
        # All three images carry the same semver, so server, broker and CLI are
        # always protocol-matched by construction.
        docker tag sovereign-config-woodpecker-broker-ci:$$CI_COMMIT_SHA "$$BROKER_IMAGE"
        docker push "$$BROKER_IMAGE"
        docker tag sovereign-config-cli-ci:$$CI_COMMIT_SHA "$$CLI_IMAGE"
        docker push "$$CLI_IMAGE"
