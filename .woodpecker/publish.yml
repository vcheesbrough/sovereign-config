# Publish workflow: once every check has passed and all three candidate images
# are pushed, release them: copy each candidate to its release name by digest,
# then push the commit's git tag. Images first, so a release tag always has its
# images. Every deployment resolves the commit's tag before it pulls anything.
# Nothing here deploys: a dev deployment is a manual Woodpecker Deploy
# (deploy-dev.yml).
#
# Workflows share nothing, so this workflow computes the release tag again.
# The patch is the pipeline number, so it is the tag build pushed the images
# under. Pipeline numbers are unique, so no two pipelines ever push the same
# tag, and no tag is ever reused. A re-run is a new pipeline: it tags the same
# commit again under its own number, and deployments take the commit's highest
# tag.
# See checks.yml for how the workflows fit together.

when:
  - event: [push, manual]

# Nothing is released until every check has passed and all three images are
# pushed. All three workflows run on push and manual alike, so neither
# dependency is optional.
depends_on:
  - checks
  - build

steps:
  # The release tag is Cargo's major.minor plus this pipeline's number as the
  # patch (scripts/ci-release-tag.sh): nothing to allocate, nothing to race,
  # and build and publish derive the same tag. ONLY on a push or manual run: a
  # deployment is its own pipeline, so computing there would name a version
  # that was never built. Deployments resolve the commit's existing tag via
  # resolve-release-tag instead (mirrors bored card #254).
  compute-version:
    when:
      - event: [push, manual]
    depends_on: []
    image: docker.io/alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
    commands:
      - sh scripts/ci-release-tag.sh Cargo.toml > .release-tag
      - echo "Release $$(cat .release-tag)"

  # Copies each candidate the build pushed to its release name, inside the
  # registry: --prefer-index=false keeps the candidate's manifest as it is, so
  # the release has the digest that passed the checks, and nothing is re-read
  # from this host. The candidate tag carries this pipeline's number, so no
  # other pipeline can have written it. Refuses to overwrite a release that
  # already exists — which a unique pipeline number rules out unless Cargo's
  # major.minor went backwards or the numbering restarted.
  promote-images:
    when:
      - event: [push, manual]
    depends_on:
      - compute-version
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_USER:
        from_secret: zot_ci_user
      REGISTRY_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - |
        RELEASE_TAG=$$(cat .release-tag)
        echo "$$REGISTRY_PASSWORD" | docker login registry.desync.link -u "$$REGISTRY_USER" --password-stdin
        # All three images carry the same semver, so server, broker and CLI are
        # always protocol-matched by construction.
        for NAME in sovereign-config sovereign-config-woodpecker-broker sovereign-config-cli; do
          CANDIDATE=registry.desync.link/$$NAME-ci:$$RELEASE_TAG
          RELEASE=registry.desync.link/$$NAME:$$RELEASE_TAG
          if docker buildx imagetools inspect "$$RELEASE" >/dev/null 2>&1; then
            echo "ERROR: $$RELEASE already exists; refusing to overwrite a release" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$$RELEASE" "$$CANDIDATE"
        done

  # A lightweight tag on this commit. The push fails if the tag already exists,
  # which a unique pipeline number rules out unless Cargo's major.minor went
  # backwards.
  tag-release:
    when:
      - event: [push, manual]
    depends_on:
      - promote-images
    image: docker.io/alpine/git:2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        git config --global --add safe.directory '*'
        RELEASE_TAG=$$(cat .release-tag)
        git tag "$$RELEASE_TAG" "$$CI_COMMIT_SHA"
        git push "https://x-access-token:$$GITHUB_TOKEN@github.com/$$CI_REPO" "refs/tags/$$RELEASE_TAG"
        echo "Tagged $$CI_COMMIT_SHA as $$RELEASE_TAG"
