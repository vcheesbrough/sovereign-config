when:
  - event: tag

steps:
  build-cli-release:
    image: docker.io/library/rust@sha256:cf9dd0ec73e75f827fe59123fff9dc65af1a1c8363c3c31ee8d7f8ad0b6a5fb2
    environment:
      CARGO_TARGET_DIR: /woodpecker/cache/sovereign-config-release-target
    volumes:
      - sovereign-config-cargo-registry:/usr/local/cargo/registry
      - sovereign-config-cargo-git:/usr/local/cargo/git
      - sovereign-config-release-target:/woodpecker/cache/sovereign-config-release-target
    commands:
      - SOVEREIGN_CONFIG_RELEASE="$$CI_COMMIT_TAG" cargo build --release --locked --package sovereign-config-cli
      - mkdir -p dist
      - cp "$$CARGO_TARGET_DIR/release/sovereign-config" dist/sovereign-config-linux-amd64
      - test "$$(dist/sovereign-config-linux-amd64 --version)" = "sovereign-config $$CI_COMMIT_TAG"
      - readelf -h dist/sovereign-config-linux-amd64
      - ldd dist/sovereign-config-linux-amd64 | tee dist/ELF-DEPENDENCIES.txt
      - |
        if awk '{print $$1}' dist/ELF-DEPENDENCIES.txt | grep -Ev '^(linux-vdso\.so\.1|libgcc_s\.so\.1|libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|/lib64/ld-linux-x86-64\.so\.2)$$'; then
          echo "CLI has a dependency outside the release allowlist"
          exit 1
        fi
      - cd dist && sha256sum sovereign-config-linux-amd64 > SHA256SUMS

  clean-debian-cli-smoke:
    depends_on:
      - build-cli-release
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker run --rm --platform linux/amd64 -v "$$CI_WORKSPACE/dist:/dist:ro" docker.io/library/debian@sha256:60eac759739651111db372c07be67863818726f754804b8707c90979bda511df /dist/sovereign-config-linux-amd64 --version

  publish-cli-release:
    depends_on:
      - clean-debian-cli-smoke
    image: docker.io/woodpeckerci/plugin-release:0.2.5@sha256:66c5cbc4c9a1311cc154d17ccbf575f14362af8689dc76071637052dc2dcec72
    settings:
      api_key:
        from_secret: github_token
      files:
        - dist/sovereign-config-linux-amd64
        - dist/SHA256SUMS
        - dist/ELF-DEPENDENCIES.txt
      file-exists: fail
      generate-release-notes: true
      title: Sovereign Config
