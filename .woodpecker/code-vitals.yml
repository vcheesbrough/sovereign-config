# code-vitals: record this repo's trunk commits (vcheesbrough/code-vitals).
#
# One plugin step, as code-vitals' README § Measuring a repo shows it. The
# plugin validates the settings below, then starts the collector of its own
# version through the docker socket: code-vitals' prod Postgres is reachable
# only on the `code-vitals_default` network and the OTLP collector only on
# `proxy-backend`, and a step's own network reaches neither.
#
# A workflow of its own, so it never blocks or slows this repo's build: its
# one step is `failure: ignore`, nothing waits for it, and a missed run is
# harmless — the next one catches up every trunk commit not yet recorded. It
# needs no checkout (skip_clone): the collector clones this public repo
# itself, with full history and tags.
#
# The step must stay in this file under this name: the plugin refuses to run
# from any other workflow, and code-vitals' deployments re-measure this repo
# from the `settings:` they read here at the head of `main`.
when:
  - event: [push, manual]
    branch: main

skip_clone: true

steps:
  code-vitals:
    # The moving tag `:stable`, which code-vitals' prod deployment moves only
    # after its checks pass — the approved exception to digest pinning
    # (code-vitals AGENTS.md § Deviations register).
    image: registry.desync.link/code-vitals-plugin:stable
    failure: ignore
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    settings:
      # Exactly what code-vitals held for this repo before self-registration
      # (its tests/measured_repos.py). Changing the area rules needs a new
      # `version`, which re-measures this repo's whole history at code-vitals'
      # next deploy; an unknown or misspelt setting fails the step.
      trunk: main
      # Tried in order at each commit; the minor is the iteration.
      version_sources:
        - {path: Cargo.toml, kind: cargo-workspace}
        - {path: Cargo.toml, kind: cargo-package}
      areas:
        version: 1
        # First match wins, so the order matters.
        rules:
          - {glob: "crates/sovereign-config-server/**", area: server}
          - {glob: "crates/sovereign-config-woodpecker-broker/**", area: server}
          - {glob: "crates/sovereign-config-web/**", area: web}
          - {glob: "crates/**", area: libraries}
          - {glob: "proto/**", area: libraries}
      # code-vitals' prod writer, from the broker's shared layer.
      writer_password:
        from_secret: code_vitals_prod_writer_password
