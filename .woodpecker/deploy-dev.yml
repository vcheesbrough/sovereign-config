# Deploy-dev workflow: development is a deployment of a build the GitHub
# Actions workflow (.github/workflows/build.yml) already checked and published
# to GHCR — triggered by Woodpecker's Deploy feature, a `deployment` event
# targeting dev, from any branch. A push never deploys (card #466). Nothing
# here builds, publishes or allocates a version: resolve chooses the build and
# proves its images are published, deploy-dev deploys it, and tag records it.
# See anchor.yml for why a push still runs a Woodpecker pipeline.

when:
  - event: deployment
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'

steps:
  # A cheap, dependency-free curl gate: live Authentik must be new enough and
  # expose every API surface managed connections need, before this workflow
  # applies its blueprint. It needs no build artifact, so it depends on nothing.
  validate-authentik-version:
    depends_on: []
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    environment:
      AUTHENTIK_API_TOKEN:
        from_secret: authentik_api_token
    commands:
      - |
        umask 077
        printf 'header = "Authorization: Bearer %s"\n' "$$AUTHENTIK_API_TOKEN" > /tmp/authentik-curl.conf
        VERSION=$$(curl --fail --silent --show-error --config /tmp/authentik-curl.conf https://auth.desync.link/api/v3/admin/version/ | sed -n 's/.*"version_current":"\([^"]*\)".*/\1/p')
        test -n "$$VERSION"
        awk -v version="$$VERSION" 'BEGIN { split(version, part, "."); if (part[1] > 2026 || (part[1] == 2026 && part[2] > 5) || (part[1] == 2026 && part[2] == 5 && part[3] >= 2)) exit 0; exit 1 }'
        curl --fail --silent --show-error --config /tmp/authentik-curl.conf https://auth.desync.link/api/v3/schema/ > /tmp/authentik-schema.json
        grep -q 'grant_types' /tmp/authentik-schema.json
        # Surfaces required by managed application connections.
        grep -q '/core/users/service_account/' /tmp/authentik-schema.json
        grep -q '/core/tokens/{identifier}/set_key/' /tmp/authentik-schema.json
        grep -q 'initial_permissions' /tmp/authentik-schema.json
        echo "Validated compatible Authentik $$VERSION"

  # Chooses what this deployment ships, and never builds or allocates: the
  # commit's release tag if it was deployed before, else its newest build that
  # .github/workflows/build.yml published (release-flow). It refuses a target
  # or branch outside the plugin's policy — dev from any branch, prod from
  # main — and checks each image's version and revision labels in GHCR, so a
  # commit with no green build fails here, before anything touches Authentik.
  # All three images must be published: a server without its matching broker
  # would leave CI resolving secrets against a stale extension, and a version
  # without its CLI image is not a whole release for the pipelines that pin it.
  # The images are public, so it needs no registry credentials.
  resolve:
    depends_on: []
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.2.0@sha256:9d5b3541aa143727f8c68c8c8f1d36557d999d3c857c4581be43363c8ff78c94
    settings:
      mode: resolve
      images:
        - ghcr.io/vcheesbrough/sovereign-config
        - ghcr.io/vcheesbrough/sovereign-config-woodpecker-broker
        - ghcr.io/vcheesbrough/sovereign-config-cli
      github_token:
        from_secret: github_token

  # Waits for resolve as well, so a commit with no published build — its
  # checks failed or have not finished — fails before anything touches
  # Authentik, and its blueprint and live tests never run.
  apply-authentik-blueprint-dev:
    depends_on:
      - validate-authentik-version
      - resolve
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-authentik-blueprint:v0.2.0@sha256:9f262c4390205b5629e9af7560f4e492f0155395a429153703ba351206d9d975
    settings:
      api_url: https://auth.desync.link
      api_token:
        from_secret: authentik_api_token
      file: authentik/blueprint-dev.yaml
      instance_name: sovereign-config-dev
      timeout_seconds: 900
      vars:
        AUTHENTIK_SOVEREIGN_CONFIG_DEV_MANAGER_API_TOKEN:
          from_secret: sovereign_config_dev_manager_api_token
        SOVEREIGN_CONFIG_DEV_BROWSER_REDIRECT_URI: https://sovereign-config-dev.desync.link/auth/callback
        AUTHENTIK_DEV_BRAND_DOMAIN: auth.desync.link

  # Exercises the connection manager against the real Authentik RBAC surface,
  # which no mock can reproduce. Runs after the blueprint so the manager
  # identity exists, and gates the deployment so a broken permission model
  # cannot reach the running service.
  validate-authentik-manager-live:
    depends_on:
      - apply-authentik-blueprint-dev
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    image: docker.io/library/rust@sha256:cf9dd0ec73e75f827fe59123fff9dc65af1a1c8363c3c31ee8d7f8ad0b6a5fb2
    environment:
      CARGO_TARGET_DIR: /woodpecker/cache/sovereign-config-target
      # Every CI run is a fresh checkout, so incremental state is written and
      # never usefully read — it was 43 GB of the shared target volume
      # (bored card #326). Off, it is also marginally faster for clean builds.
      CARGO_INCREMENTAL: "0"
      SOVEREIGN_CONFIG_LIVE_AUTHENTIK_URL: https://auth.desync.link/
      SOVEREIGN_CONFIG_LIVE_MANAGED_GROUP: sovereign-config-dev-connections
      SOVEREIGN_CONFIG_LIVE_AUTHENTIK_TOKEN:
        from_secret: sovereign_config_dev_manager_api_token
      # Elevated credential used only to create and clean up a disposable
      # canary object for the "manager cannot touch objects it didn't create"
      # test; never used to act as the manager under test.
      SOVEREIGN_CONFIG_LIVE_AUTHENTIK_ADMIN_TOKEN:
        from_secret: authentik_api_token
    volumes:
      - sovereign-config-cargo-registry:/usr/local/cargo/registry
      - sovereign-config-cargo-git:/usr/local/cargo/git
      - sovereign-config-contract-target:/woodpecker/cache/sovereign-config-target
    commands:
      # Cargo never reaps artifacts from commits it no longer builds; this
      # enforces the 20 GiB ceiling on the shared volume (bored card #326).
      - scripts/ci-prune-cargo-target.sh
      - cargo test --package sovereign-config-authentik live_ -- --ignored --test-threads=1

  deploy-dev:
    depends_on:
      - validate-authentik-manager-live
      - resolve
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      POSTGRES_PASSWORD:
        from_secret: sovereign_config_dev_postgres_password
      OIDC_ISSUER: https://auth.desync.link/application/o/sovereign-config-dev/
      MANAGER_API_TOKEN:
        from_secret: sovereign_config_dev_manager_api_token
      VALUE_ENCRYPTION_KEY:
        from_secret: sovereign_config_dev_value_encryption_key
    commands:
      - |
        # Telemetry (docs/project-deployment.md): non-secret, so kept here with the
        # deploy rather than in the store this deploy would have to read itself
        # from. compose.yaml passes the names through.
        #
        # Compose runs as its plugin binary, not as `docker compose`: the
        # docker 27 CLI overwrites OTEL_RESOURCE_ATTRIBUTES with its own
        # `docker.cli.cobra.command_path=…` when it execs a plugin, so the
        # server would lose deployment.environment.name (pipelines 311, 312).
        COMPOSE=/usr/local/libexec/docker/cli-plugins/docker-compose
        export OTEL_SERVICE_NAME=sovereign-config
        export OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=dev,telemetry_source=otlp
        export OTEL_EXPORTER_OTLP_ENDPOINT=http://monitor-alloy:4318
        export OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
        export OTEL_LOGS_EXPORTER=otlp
        export OTEL_TRACES_EXPORTER=otlp
        export OTEL_METRICS_EXPORTER=otlp
        printf 'telemetry: %s\n' "$$OTEL_RESOURCE_ATTRIBUTES"
        ENCODED_PASSWORD=$$(printf '%s' "$$POSTGRES_PASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../%&/g')
        # Exported rather than prefixed, because two Compose runs read them.
        export SOVEREIGN_CONFIG_IMAGE_TAG=$$(cat .release-tag) SOVEREIGN_CONFIG_ENV=dev SOVEREIGN_CONFIG_HOST=sovereign-config-dev.desync.link SOVEREIGN_CONFIG_CONTAINER_NAME=sovereign-config-dev POSTGRES_DATA_VOLUME=sovereign-config-dev-db POSTGRES_PASSWORD_FILE= SOVEREIGN_CONFIG_DATABASE_URL_FILE= SOVEREIGN_CONFIG_DATABASE_URL="postgresql://sovereign_config:$$ENCODED_PASSWORD@postgres:5432/sovereign_config" SOVEREIGN_CONFIG_OIDC_ISSUER=https://auth.desync.link/application/o/sovereign-config-dev/ SOVEREIGN_CONFIG_OIDC_AUDIENCE=sovereign-config-dev SOVEREIGN_CONFIG_PUBLIC_ORIGIN=https://sovereign-config-dev.desync.link SOVEREIGN_CONFIG_CLIENT_TELEMETRY_ENDPOINT=https://sovereign-config-dev.desync.link SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE=sovereign_config_dev_grants SOVEREIGN_CONFIG_MANAGER_GROUP=sovereign-config-dev-connections SOVEREIGN_CONFIG_MANAGER_API_TOKEN_FILE= SOVEREIGN_CONFIG_MANAGER_API_TOKEN="$$MANAGER_API_TOKEN" SOVEREIGN_CONFIG_VALUE_ENCRYPTION_KEY_FILE= SOVEREIGN_CONFIG_VALUE_ENCRYPTION_KEY="$$VALUE_ENCRYPTION_KEY"
        "$$COMPOSE" -p sovereign-config-dev up -d --pull always --wait --wait-timeout 90 || {
          "$$COMPOSE" -p sovereign-config-dev logs --tail 200
          exit 1
        }
        # The web UI's telemetry ingest (compose profile `client-telemetry`),
        # started after the gate above and never part of it: its failure is a
        # warning, not a failed deploy (docs/observability.md).
        "$$COMPOSE" -p sovereign-config-dev --profile client-telemetry up -d --no-deps otlp-ingest || echo "WARNING: the client-telemetry ingest did not start; the deploy continues without it" >&2

  # Records the deploy once it has succeeded: the annotated git tag named by
  # .release-tag, so a tag means "this build was deployed". A no-op when the
  # commit already carries it — a redeploy, or dev then prod — and the plugin
  # refuses a second tag on a commit or a tag that would move. The deployment
  # smoke check runs after the pipeline (AGENTS.md), so it never holds this up.
  tag:
    depends_on:
      - deploy-dev
    when:
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "dev"'
    pull: true
    image: ghcr.io/vcheesbrough/woodpecker-plugin-release-versions:0.2.0@sha256:9d5b3541aa143727f8c68c8c8f1d36557d999d3c857c4581be43363c8ff78c94
    settings:
      mode: tag
      github_token:
        from_secret: github_token
