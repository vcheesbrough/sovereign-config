version: 1
metadata:
  name: sovereign-config OIDC
  labels:
    blueprints.goauthentik.io/description: "Sovereign Config production OAuth2 providers, application, and grant scope"

entries:
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: sovereign-config grants
    attrs:
      name: sovereign-config grants
      scope_name: sovereign-config
      description: "Sovereign Config path grants"
      expression: |
        grants = []
        attribute_sets = [request.user.attributes]
        attribute_sets.extend(group.attributes for group in request.user.ak_groups.all())
        for attributes in attribute_sets:
            for grant in attributes.get("sovereign_config_grants", []):
                if grant not in grants:
                    grants.append(grant)
        return {"sovereign_config_grants": grants}

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config-introspection
    attrs:
      name: sovereign-config-introspection
      client_id: sovereign-config-introspection
      client_secret: ${AUTHENTIK_SOVEREIGN_CONFIG_INTROSPECTION_CLIENT_SECRET}
      client_type: confidential
      redirect_uris: []
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config-browser
    attrs:
      name: sovereign-config-browser
      client_id: sovereign-config-browser
      client_type: public
      grant_types:
        - authorization_code
      redirect_uris:
        - url: ${SOVEREIGN_CONFIG_BROWSER_REDIRECT_URI}
          matching_mode: strict
      access_token_validity: minutes=5
      refresh_token_validity: hours=8
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, sovereign-config]]
      jwt_federation_providers:
        - !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-introspection]]

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config-cli
    attrs:
      name: sovereign-config-cli
      client_id: sovereign-config-cli
      client_type: public
      grant_types:
        - urn:ietf:params:oauth:grant-type:device_code
        - refresh_token
      redirect_uris: []
      access_token_validity: minutes=5
      refresh_token_validity: hours=8
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, sovereign-config]]
      jwt_federation_providers:
        - !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-introspection]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: sovereign-config
    attrs:
      name: Sovereign Config
      slug: sovereign-config
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-browser]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: sovereign-config-cli
    attrs:
      name: Sovereign Config CLI
      slug: sovereign-config-cli
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-cli]]

  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: sovereign-config-device-code
    attrs:
      name: Sovereign Config device code
      title: Authorize Sovereign Config CLI
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: ${AUTHENTIK_BRAND_DOMAIN}
    attrs:
      flow_device_code: !Find [authentik_flows.flow, [slug, sovereign-config-device-code]]
