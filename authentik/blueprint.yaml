version: 1
metadata:
  name: sovereign-config OIDC
  labels:
    blueprints.goauthentik.io/description: "Sovereign Config production OAuth2 providers, application, and grant scope"

entries:
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: sovereign-config production grants
    attrs:
      name: sovereign-config production grants
      scope_name: sovereign-config
      description: "Sovereign Config production path grants"
      expression: |
        grants = []
        attribute_sets = [request.user.attributes]
        attribute_sets.extend(group.attributes for group in request.user.ak_groups.all())
        for attributes in attribute_sets:
            for grant in attributes.get("sovereign_config_prod_grants", []):
                if grant not in grants:
                    grants.append(grant)
        return {"sovereign_config_grants": grants}

  - model: authentik_core.group
    state: present
    identifiers:
      name: sovereign-config-production-config-contributor
    attrs:
      is_superuser: false
      attributes:
        sovereign_config_prod_grants:
          - prefix: "/"
            permissions:
              - read
              - write
              - manage

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config-introspection
    attrs:
      name: sovereign-config-introspection
      client_id: sovereign-config-introspection
      client_secret: ${AUTHENTIK_SOVEREIGN_CONFIG_INTROSPECTION_CLIENT_SECRET}
      client_type: confidential
      redirect_uris: []
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config
    attrs:
      name: sovereign-config
      client_id: sovereign-config
      client_type: public
      grant_types:
        - authorization_code
        - urn:ietf:params:oauth:grant-type:device_code
        - refresh_token
        - client_credentials
      redirect_uris:
        - url: ${SOVEREIGN_CONFIG_BROWSER_REDIRECT_URI}
          matching_mode: strict
      access_token_validity: minutes=5
      refresh_token_validity: hours=8
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        # The browser UI names the signed-in operator in its header. `sub` is
        # issued hashed here (see sub_mode below), so `profile` (name,
        # preferred_username) and `email` are the only sources of a claim a
        # person recognises — `email` is a separate scope from `profile` in
        # Authentik's default mappings, so both are attached. Neither labels
        # anything but the header: authorization runs on the grants mapping
        # alone.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, sovereign-config production grants]]
      jwt_federation_providers:
        - !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-introspection]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: sovereign-config
    attrs:
      name: Sovereign Config
      slug: sovereign-config
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config]]

  # Isolated identity used only to provision managed application connections.
  # It may create users and tokens, and administer only the objects it created
  # (granted per object by the initial-permissions policy below). It is not a
  # superuser, has no Admin UI access, and cannot read, change, or delete an
  # unrelated user or token, nor view any token key.
  - model: authentik_rbac.role
    state: present
    identifiers:
      name: sovereign-config-connection-manager
    attrs:
      name: sovereign-config-connection-manager
      permissions:
        - authentik_core.add_user
        - authentik_core.add_token
        # Authentik's service-account endpoint creates the app-password token with a
        # direct ORM call, so InitialPermissions never attaches to it, and TokenViewSet
        # only shows a non-superuser tokens they own. Without a global view the manager
        # cannot discover or rotate the credential it just created. This exposes token
        # metadata only: view_token_key is deliberately never granted, so no key is
        # ever readable.
        - authentik_core.view_token
        # Global so the manager can resolve the browsing group below by name
        # even once it holds no object-level permission on any managed
        # account. Grants nothing: group membership carries no permissions
        # here and authorization is granted directly on the service account.
        - authentik_core.view_group

  - model: authentik_core.group
    state: present
    identifiers:
      name: sovereign-config-connection-manager
    attrs:
      is_superuser: false
      roles:
        - !Find [authentik_rbac.role, [name, sovereign-config-connection-manager]]

  # Purely organizational: every managed connection's service account is added
  # here so an operator can browse them together in Authentik. Carries no
  # roles and grants no permissions.
  - model: authentik_core.group
    state: present
    identifiers:
      name: sovereign-config-connections
    attrs:
      is_superuser: false

  - model: authentik_rbac.initialpermissions
    state: present
    identifiers:
      name: sovereign-config-connection-manager-objects
    attrs:
      name: sovereign-config-connection-manager-objects
      mode: role
      role: !Find [authentik_rbac.role, [name, sovereign-config-connection-manager]]
      permissions:
        - !Find [auth.permission, [codename, view_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, change_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, delete_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, view_token], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, set_token_key], [content_type__app_label, authentik_core]]

  - model: authentik_core.user
    state: present
    identifiers:
      username: sovereign-config-connection-manager
    attrs:
      username: sovereign-config-connection-manager
      name: Sovereign Config connection manager
      type: service_account
      is_active: true
      path: goauthentik.io/service-accounts
      groups:
        - !Find [authentik_core.group, [name, sovereign-config-connection-manager]]

  - model: authentik_core.token
    state: present
    identifiers:
      identifier: sovereign-config-connection-manager-api
    attrs:
      identifier: sovereign-config-connection-manager-api
      intent: api
      user: !Find [authentik_core.user, [username, sovereign-config-connection-manager]]
      key: ${AUTHENTIK_SOVEREIGN_CONFIG_MANAGER_API_TOKEN}
      description: "Sovereign Config managed-connection administration"
      expiring: false

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: sovereign-config-cli

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: sovereign-config-browser

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: sovereign-config-cli

  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: sovereign-config-device-code
    attrs:
      name: Sovereign Config device code
      title: Authorize Sovereign Config CLI
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: ${AUTHENTIK_BRAND_DOMAIN}
    attrs:
      flow_device_code: !Find [authentik_flows.flow, [slug, sovereign-config-device-code]]
