version: 1
metadata:
  name: sovereign-config development OIDC
  labels:
    blueprints.goauthentik.io/description: "Sovereign Config development OAuth2 providers, application, and grant scope"

entries:
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: sovereign-config development grants
    attrs:
      name: sovereign-config development grants
      scope_name: sovereign-config
      description: "Sovereign Config development path grants"
      expression: |
        grants = []
        attribute_sets = [request.user.attributes]
        attribute_sets.extend(group.attributes for group in request.user.ak_groups.all())
        for attributes in attribute_sets:
            for grant in attributes.get("sovereign_config_dev_grants", []):
                if grant not in grants:
                    grants.append(grant)
        return {"sovereign_config_grants": grants}

  - model: authentik_core.group
    state: present
    identifiers:
      name: sovereign-config-development-config-contributor
    attrs:
      is_superuser: false
      attributes:
        sovereign_config_dev_grants:
          - prefix: "/"
            permissions:
              - read
              - write
              - manage

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config-introspection-dev
    attrs:
      name: sovereign-config-introspection-dev
      client_id: sovereign-config-introspection-dev
      client_secret: ${AUTHENTIK_SOVEREIGN_CONFIG_DEV_INTROSPECTION_CLIENT_SECRET}
      client_type: confidential
      redirect_uris: []
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sovereign-config-dev
    attrs:
      name: sovereign-config-dev
      client_id: sovereign-config-dev
      client_type: public
      grant_types:
        - authorization_code
        - urn:ietf:params:oauth:grant-type:device_code
        - refresh_token
        - client_credentials
      redirect_uris:
        - url: ${SOVEREIGN_CONFIG_DEV_BROWSER_REDIRECT_URI}
          matching_mode: strict
      access_token_validity: minutes=5
      refresh_token_validity: hours=8
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, sovereign-config development grants]]
      jwt_federation_providers:
        - !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-introspection-dev]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: sovereign-config-dev
    attrs:
      name: Sovereign Config (development)
      slug: sovereign-config-dev
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, sovereign-config-dev]]

  # Isolated identity used only to provision managed application connections.
  # It may create users and tokens, and administer only the objects it created
  # (granted per object by the initial-permissions policy below). It is not a
  # superuser, has no Admin UI access, and cannot read, change, or delete an
  # unrelated user or token, nor view any token key.
  - model: authentik_rbac.role
    state: present
    identifiers:
      name: sovereign-config-dev-connection-manager
    attrs:
      name: sovereign-config-dev-connection-manager
      permissions:
        - authentik_core.add_user
        - authentik_core.add_token

  - model: authentik_core.group
    state: present
    identifiers:
      name: sovereign-config-dev-connection-manager
    attrs:
      is_superuser: false
      roles:
        - !Find [authentik_rbac.role, [name, sovereign-config-dev-connection-manager]]

  - model: authentik_rbac.initialpermissions
    state: present
    identifiers:
      name: sovereign-config-dev-connection-manager-objects
    attrs:
      name: sovereign-config-dev-connection-manager-objects
      mode: role
      role: !Find [authentik_rbac.role, [name, sovereign-config-dev-connection-manager]]
      permissions:
        - !Find [auth.permission, [codename, view_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, change_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, delete_user], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, view_token], [content_type__app_label, authentik_core]]
        - !Find [auth.permission, [codename, set_token_key], [content_type__app_label, authentik_core]]

  - model: authentik_core.user
    state: present
    identifiers:
      username: sovereign-config-dev-connection-manager
    attrs:
      username: sovereign-config-dev-connection-manager
      name: Sovereign Config development connection manager
      type: service_account
      is_active: true
      path: goauthentik.io/service-accounts
      groups:
        - !Find [authentik_core.group, [name, sovereign-config-dev-connection-manager]]

  - model: authentik_core.token
    state: present
    identifiers:
      identifier: sovereign-config-dev-connection-manager-api
    attrs:
      identifier: sovereign-config-dev-connection-manager-api
      intent: api
      user: !Find [authentik_core.user, [username, sovereign-config-dev-connection-manager]]
      key: ${AUTHENTIK_SOVEREIGN_CONFIG_DEV_MANAGER_API_TOKEN}
      description: "Sovereign Config development managed-connection administration"
      expiring: false

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: sovereign-config-cli-dev

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: sovereign-config-browser-dev

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: sovereign-config-cli-dev

  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: sovereign-config-device-code
    attrs:
      name: Sovereign Config device code
      title: Authorize Sovereign Config CLI
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: ${AUTHENTIK_DEV_BRAND_DOMAIN}
    attrs:
      flow_device_code: !Find [authentik_flows.flow, [slug, sovereign-config-device-code]]
