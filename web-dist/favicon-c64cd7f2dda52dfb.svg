<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Colours match style.css :root — monochrome phosphor-green surfaces, amber mark. -->
  <rect width="64" height="64" rx="12" fill="#042108" />
  <rect x="11" y="13" width="42" height="38" rx="6" fill="#0a2e0f" stroke="#239032" stroke-width="1" />
  <!-- Green accent stripe, as on interactive affordances. -->
  <rect x="11" y="13" width="4" height="38" rx="1" fill="#0a841a" />
  <!-- The three-bar brand mark, drawn at the same relative heights as the header. -->
  <rect x="22" y="34" width="6" height="10" rx="1.5" fill="#fbbf24" />
  <rect x="31" y="26" width="6" height="18" rx="1.5" fill="#fbbf24" />
  <rect x="40" y="30" width="6" height="14" rx="1.5" fill="#fbbf24" />
  <!-- Padlock shackle over the bars, amber like the in-app padlock: configuration held under lock. -->
  <path d="M26 24v-3a6 6 0 0 1 12 0v3" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
</svg>
