[package]
name = "sovereign-config-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party Sovereign Config local stdio MCP server"
build = "build.rs"

[[bin]]
name = "sovereign-config-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sovereign-config-client = { path = "../sovereign-config-client" }
sovereign-config-core = { path = "../sovereign-config-core" }
sovereign-config-native = { path = "../sovereign-config-native" }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
