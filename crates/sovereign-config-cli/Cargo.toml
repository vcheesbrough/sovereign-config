[package]
name = "sovereign-config-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party Sovereign Config command-line client"
build = "build.rs"

[[bin]]
name = "sovereign-config"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
rpassword = "7.5.4"
serde_json.workspace = true
sovereign-config-client = { path = "../sovereign-config-client" }
sovereign-config-core = { path = "../sovereign-config-core" }
sovereign-config-layers = { path = "../sovereign-config-layers" }
sovereign-config-native = { path = "../sovereign-config-native" }
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
prost-types.workspace = true
sovereign-config-proto = { path = "../sovereign-config-proto" }
tempfile = "3.27.0"
tonic = { version = "0.12.3", features = ["transport"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
url.workspace = true

[lints]
workspace = true
