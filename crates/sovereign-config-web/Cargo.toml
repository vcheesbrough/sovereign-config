[package]
name = "sovereign-config-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Test-only, and never part of a wasm build: the unit tests below run natively
# and a few of them drive `async` transport code.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[dependencies]
async-trait.workspace = true
base64.workspace = true
js-sys.workspace = true
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
sha2.workspace = true
sovereign-config-client = { path = "../sovereign-config-client" }
sovereign-config-core = { path = "../sovereign-config-core" }
sovereign-config-proto = { path = "../sovereign-config-proto" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "Clipboard",
  "CssStyleDeclaration",
  "Crypto",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "Headers",
  "History",
  "HtmlButtonElement",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlCollection",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "Navigator",
  "PointerEvent",
  "Request",
  "RequestCache",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "UrlSearchParams",
  "Window",
]

[lints]
workspace = true
