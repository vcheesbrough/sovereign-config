[package]
name = "sovereign-config-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
# The Connect protocol for the handshake and `v6` (#582): buffa messages
# bridged onto the prost shims.
buffa.workspace = true
connectrpc.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
mime_guess.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest = { workspace = true, features = ["json"] }
ring.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["tls", "transport"] }
tonic-health.workspace = true
tonic-web.workspace = true
tower.workspace = true
tracing.workspace = true
# The metrics façade: instruments and attributes, never an SDK type.
opentelemetry.workspace = true
zeroize.workspace = true
sovereign-config-proto = { path = "../sovereign-config-proto" }
sovereign-config-connect = { path = "../sovereign-config-connect" }
sovereign-config-core = { path = "../sovereign-config-core" }
# The identity-provider contract managed connections depend on, and its one
# implementation, which only `main.rs` names (`tests/lint_ratchet.rs`).
sovereign-config-identity = { path = "../sovereign-config-identity" }
sovereign-config-authentik = { path = "../sovereign-config-authentik" }
sovereign-config-telemetry = { path = "../sovereign-config-telemetry" }

[dev-dependencies]
# The native client, driven through an HTTP/1.1-only proxy against the
# Connect stack (`connect/proxy_tests.rs`): the transport the CLI, the MCP
# server, the provider and the broker share.
sovereign-config-client = { path = "../sovereign-config-client" }
sovereign-config-native = { path = "../sovereign-config-native" }
# The in-memory provider, for driving the managed service without HTTP.
sovereign-config-identity = { path = "../sovereign-config-identity", features = ["conformance"] }
# Exported spans and log records in plain types, for asserting on what left.
sovereign-config-telemetry = { path = "../sovereign-config-telemetry", features = ["testing"] }
# SIGTERM for the telemetry process tests, as `docker stop` sends it.
rustix.workspace = true
serde_yaml.workspace = true
tempfile = "3.27.0"
tokio-stream = { version = "0.1.18", features = ["net"] }
# `Notify`, for the mock identity provider's call gates (`managed/tests.rs`).
tokio = { workspace = true, features = ["sync"] }
# A second protobuf package, registered alongside v3 only in integration tests,
# so concurrent protocol serving is proven before a real v4 relies on it. Never
# reaches the release binary.
sovereign-config-proto-testversion = { path = "../../test-consumers/sovereign-config-proto-testversion" }

[lints]
workspace = true
