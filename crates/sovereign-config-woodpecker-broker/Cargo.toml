[package]
name = "sovereign-config-woodpecker-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Woodpecker CI external secrets extension backed by Sovereign Config"

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem"] }
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sovereign-config-client = { path = "../sovereign-config-client" }
sovereign-config-core = { path = "../sovereign-config-core" }
sovereign-config-native = { path = "../sovereign-config-native" }
subtle = "2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sovereign-config-proto = { path = "../sovereign-config-proto" }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.12.3", features = ["transport"] }

[lints]
workspace = true
