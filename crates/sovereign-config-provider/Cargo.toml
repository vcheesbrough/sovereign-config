[package]
name = "sovereign-config-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ergonomic application-configuration facade over the Sovereign Config native client"

[features]
# Opt-in `config`-crate integration: a `config::Source` that loads the managed
# subtree when the configuration is built. Off by default to keep the base
# facade dependency-light.
config = ["dep:config", "dep:tokio"]

[dependencies]
async-trait.workspace = true
config = { version = "0.15", optional = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
sovereign-config-client = { path = "../sovereign-config-client" }
sovereign-config-core = { path = "../sovereign-config-core" }
sovereign-config-native = { path = "../sovereign-config-native" }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
sovereign-config-proto = { path = "../sovereign-config-proto" }
tokio.workspace = true
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.12.3", features = ["transport"] }

[lints]
workspace = true
