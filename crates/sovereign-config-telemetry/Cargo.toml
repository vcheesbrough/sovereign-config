[package]
name = "sovereign-config-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The one module that owns telemetry: OTEL_* validation, resource identity, OTLP export and shutdown"
publish = false

[features]
# In-memory exporters and plain-typed results for other crates' tests; only
# ever enabled from a `[dev-dependencies]` entry.
testing = ["opentelemetry_sdk/testing"]

[dependencies]
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-appender-tracing.workspace = true
# `user.*`, `rpc.method` and `url.template` are still marked experimental.
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
opentelemetry-http.workspace = true
tracing-opentelemetry.workspace = true
http.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustix = { workspace = true, features = ["system"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true
