services:
  postgres:
    image: docker.io/library/postgres@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    container_name: ${SOVEREIGN_CONFIG_CONTAINER_NAME:?Set SOVEREIGN_CONFIG_CONTAINER_NAME}-postgres
    environment:
      POSTGRES_DB: sovereign_config
      POSTGRES_USER: sovereign_config
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE-/run/secrets/postgres_password}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_config -d sovereign_config"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - sovereign_config_private
    # Without these the database's stdout reaches Loki under its container name,
    # so dev and prod look like two unrelated services and neither answers to
    # `deployment_environment`. No metrics labels: Postgres exposes no
    # Prometheus endpoint for Alloy to scrape.
    labels:
      - "observability.service.name=sovereign-config-postgres"
      - "observability.deployment.environment=${SOVEREIGN_CONFIG_ENV:-dev}"
    restart: unless-stopped

  sovereign-config:
    image: registry.desync.link/sovereign-config:${SOVEREIGN_CONFIG_IMAGE_TAG:-local}
    container_name: ${SOVEREIGN_CONFIG_CONTAINER_NAME:?Set SOVEREIGN_CONFIG_CONTAINER_NAME}
    environment:
      SOVEREIGN_CONFIG_DATABASE_URL: ${SOVEREIGN_CONFIG_DATABASE_URL:-}
      SOVEREIGN_CONFIG_DATABASE_URL_FILE: ${SOVEREIGN_CONFIG_DATABASE_URL_FILE-/run/secrets/database_url}
      SOVEREIGN_CONFIG_GRPC_ADDR: 0.0.0.0:50051
      SOVEREIGN_CONFIG_METRICS_ADDR: 0.0.0.0:9090
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL:?Set SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL}
      SOVEREIGN_CONFIG_OIDC_ISSUER: ${SOVEREIGN_CONFIG_OIDC_ISSUER:?Set SOVEREIGN_CONFIG_OIDC_ISSUER}
      SOVEREIGN_CONFIG_OIDC_AUDIENCE: ${SOVEREIGN_CONFIG_OIDC_AUDIENCE:?Set SOVEREIGN_CONFIG_OIDC_AUDIENCE}
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID:?Set SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID}
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET:-}
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET_FILE: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET_FILE-/run/secrets/oidc_introspection_client_secret}
      SOVEREIGN_CONFIG_PUBLIC_ORIGIN: ${SOVEREIGN_CONFIG_PUBLIC_ORIGIN:?Set SOVEREIGN_CONFIG_PUBLIC_ORIGIN}
      SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE: ${SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE:?Set SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE}
      SOVEREIGN_CONFIG_MANAGER_GROUP: ${SOVEREIGN_CONFIG_MANAGER_GROUP:?Set SOVEREIGN_CONFIG_MANAGER_GROUP}
      SOVEREIGN_CONFIG_MANAGER_API_TOKEN: ${SOVEREIGN_CONFIG_MANAGER_API_TOKEN:-}
      SOVEREIGN_CONFIG_MANAGER_API_TOKEN_FILE: ${SOVEREIGN_CONFIG_MANAGER_API_TOKEN_FILE-/run/secrets/manager_api_token}
      SOVEREIGN_CONFIG_VALUE_ENCRYPTION_KEY: ${SOVEREIGN_CONFIG_VALUE_ENCRYPTION_KEY:-}
      SOVEREIGN_CONFIG_VALUE_ENCRYPTION_KEY_FILE: ${SOVEREIGN_CONFIG_VALUE_ENCRYPTION_KEY_FILE-/run/secrets/value_encryption_key}
      # Where the web UI sends its logs: this deployment's public origin when
      # the otlp-ingest service below runs, unset (client telemetry off)
      # otherwise. Product configuration handed to the page, not a knob of the
      # server's own telemetry.
      SOVEREIGN_CONFIG_CLIENT_TELEMETRY_ENDPOINT: ${SOVEREIGN_CONFIG_CLIENT_TELEMETRY_ENDPOINT:-}
      # Telemetry: names only, never a value. Each is passed through from the
      # deploy step's environment when set there and left unset otherwise, so
      # a deployment without them runs with telemetry off (README
      # "Observability"). The values live with the deploy step.
      OTEL_SERVICE_NAME:
      OTEL_RESOURCE_ATTRIBUTES:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_PROTOCOL:
      OTEL_EXPORTER_OTLP_HEADERS:
      OTEL_LOGS_EXPORTER:
      OTEL_METRICS_EXPORTER:
      OTEL_TRACES_EXPORTER:
      OTEL_SDK_DISABLED:
    # The source of service.instance.id (a UUID derived from it): named after
    # the container rather than Docker's per-container id, so it survives a
    # redeploy and the instance keeps one identity.
    hostname: ${SOVEREIGN_CONFIG_CONTAINER_NAME:?Set SOVEREIGN_CONFIG_CONTAINER_NAME}
    secrets:
      - database_url
      - oidc_introspection_client_secret
      - manager_api_token
      - value_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sovereign_config_private
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-backend"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.entrypoints=websecure"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.rule=Host(`${SOVEREIGN_CONFIG_HOST:?Set SOVEREIGN_CONFIG_HOST}`)"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.tls=true"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.tls.certresolver=myresolver"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.middlewares=lan-vpn-only@docker,rate-limit@docker,crowdsec@docker,security-headers@docker"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.service=${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}"
      - "traefik.http.services.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.loadbalancer.server.port=50051"
      - "traefik.http.services.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.loadbalancer.server.scheme=h2c"
      - "observability.metrics.scrape=true"
      - "observability.metrics.port=9090"
      - "observability.metrics.path=/metrics"
      - "observability.metrics.scheme=http"
      - "observability.service.name=sovereign-config"
      - "observability.deployment.environment=${SOVEREIGN_CONFIG_ENV:-dev}"
    restart: unless-stopped

  # The web UI's telemetry ingest (README "Observability", *Client
  # telemetry*): the published otlp-collector-oidc image, unmodified, one per
  # environment. It validates the operator's access token (issuer, audience =
  # this product's client id, expiry, `telemetry:write`), stamps `user.*`, the
  # environment and `telemetry_source=client` over whatever the page sent, and
  # forwards to the shared collector with the same OTLP_* values as the
  # server. Traefik routes OTLP's own `/v1/` paths on the app's hostname here,
  # so the page sends same-origin.
  #
  # Never a dependency and never waited on: it is in its own profile, so a
  # plain `up` (and its `--wait`) leaves it out; the deploy starts it after
  # the health gate and tolerates its failure; nothing lists it in
  # `depends_on`. Stopping this container is the emergency stop; the page
  # drops its records and carries on.
  otlp-ingest:
    profiles:
      - client-telemetry
    image: ghcr.io/vcheesbrough/otlp-collector-oidc:0.13.0@sha256:2db8a527da487c9091b74ee3a537785153b26f914e9e6f3ca2f1684793f02666
    container_name: ${SOVEREIGN_CONFIG_CONTAINER_NAME:?Set SOVEREIGN_CONFIG_CONTAINER_NAME}-otlp-ingest
    environment:
      # The server's own issuer and audience: a token minted for any other
      # client is refused (the confused-deputy guard).
      OIDC_ISSUER_URL: ${SOVEREIGN_CONFIG_OIDC_ISSUER:?Set SOVEREIGN_CONFIG_OIDC_ISSUER}
      OIDC_AUDIENCE: ${SOVEREIGN_CONFIG_OIDC_AUDIENCE:?Set SOVEREIGN_CONFIG_OIDC_AUDIENCE}
      # `service.name` becomes a stream label: the page's one name only.
      ALLOWED_SERVICE_NAMES: sovereign-config-web
      CLIENT_RESOURCE_ATTRIBUTES: deployment.environment.name=${SOVEREIGN_CONFIG_ENV:-dev},telemetry_source=client
      # Decompressed; Traefik caps the wire body at the same size below.
      MAX_REQUEST_BODY_BYTES: "1048576"
      # This process's own name on its own logs and metrics. Its upstream,
      # protocol and resource attributes are the deploy step's, passed by name
      # as for the server (and so through the compose plugin binary, which
      # leaves OTEL_RESOURCE_ATTRIBUTES alone).
      OTEL_SERVICE_NAME: sovereign-config-otlp-ingest
      OTEL_RESOURCE_ATTRIBUTES:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_PROTOCOL:
    networks:
      - traefik
    user: "10001:10001"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-backend"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.entrypoints=websecure"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.rule=Host(`${SOVEREIGN_CONFIG_HOST:?Set SOVEREIGN_CONFIG_HOST}`) && PathPrefix(`/v1/`)"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.tls=true"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.tls.certresolver=myresolver"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.middlewares=lan-vpn-only@docker,rate-limit@docker,crowdsec@docker,${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp-body"
      - "traefik.http.middlewares.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp-body.buffering.maxRequestBodyBytes=1048576"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.service=${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp"
      # TLS to the container's embedded self-signed certificate, which the
      # platform's default serversTransport already accepts.
      - "traefik.http.services.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.loadbalancer.server.port=4318"
      - "traefik.http.services.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}-otlp.loadbalancer.server.scheme=https"
      # Its own metrics, among them refusals by reason and records dropped.
      - "observability.metrics.scrape=true"
      - "observability.metrics.port=8888"
      - "observability.metrics.path=/metrics"
      - "observability.metrics.scheme=http"
      - "observability.service.name=sovereign-config-otlp-ingest"
      - "observability.deployment.environment=${SOVEREIGN_CONFIG_ENV:-dev}"
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-/dev/null}
  database_url:
    file: ${DATABASE_URL_FILE:-/dev/null}
  oidc_introspection_client_secret:
    file: ${OIDC_INTROSPECTION_CLIENT_SECRET_FILE:-/dev/null}
  manager_api_token:
    file: ${MANAGER_API_TOKEN_FILE:-/dev/null}
  value_encryption_key:
    file: ${VALUE_ENCRYPTION_KEY_FILE:-/dev/null}

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:?Set POSTGRES_DATA_VOLUME to a pre-created external volume holding the PostgreSQL data directory}

networks:
  sovereign_config_private:
    internal: true
  traefik:
    external: true
    name: proxy-backend
