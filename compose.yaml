services:
  postgres:
    image: docker.io/library/postgres@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    container_name: ${SOVEREIGN_CONFIG_CONTAINER_NAME:?Set SOVEREIGN_CONFIG_CONTAINER_NAME}-postgres
    environment:
      POSTGRES_DB: sovereign_config
      POSTGRES_USER: sovereign_config
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE-/run/secrets/postgres_password}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_config -d sovereign_config"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - sovereign_config_private
    restart: unless-stopped

  sovereign-config:
    image: registry.desync.link/sovereign-config:${SOVEREIGN_CONFIG_IMAGE_TAG:-local}
    container_name: ${SOVEREIGN_CONFIG_CONTAINER_NAME:?Set SOVEREIGN_CONFIG_CONTAINER_NAME}
    environment:
      SOVEREIGN_CONFIG_DATABASE_URL: ${SOVEREIGN_CONFIG_DATABASE_URL:-}
      SOVEREIGN_CONFIG_DATABASE_URL_FILE: ${SOVEREIGN_CONFIG_DATABASE_URL_FILE-/run/secrets/database_url}
      SOVEREIGN_CONFIG_GRPC_ADDR: 0.0.0.0:50051
      SOVEREIGN_CONFIG_METRICS_ADDR: 0.0.0.0:9090
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL:?Set SOVEREIGN_CONFIG_OIDC_INTROSPECTION_URL}
      SOVEREIGN_CONFIG_OIDC_ISSUER: ${SOVEREIGN_CONFIG_OIDC_ISSUER:?Set SOVEREIGN_CONFIG_OIDC_ISSUER}
      SOVEREIGN_CONFIG_OIDC_AUDIENCE: ${SOVEREIGN_CONFIG_OIDC_AUDIENCE:?Set SOVEREIGN_CONFIG_OIDC_AUDIENCE}
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID:?Set SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_ID}
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET:-}
      SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET_FILE: ${SOVEREIGN_CONFIG_OIDC_INTROSPECTION_CLIENT_SECRET_FILE-/run/secrets/oidc_introspection_client_secret}
      SOVEREIGN_CONFIG_PUBLIC_ORIGIN: ${SOVEREIGN_CONFIG_PUBLIC_ORIGIN:?Set SOVEREIGN_CONFIG_PUBLIC_ORIGIN}
      SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE: ${SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE:?Set SOVEREIGN_CONFIG_MANAGER_GRANTS_ATTRIBUTE}
      SOVEREIGN_CONFIG_MANAGER_API_TOKEN: ${SOVEREIGN_CONFIG_MANAGER_API_TOKEN:-}
      SOVEREIGN_CONFIG_MANAGER_API_TOKEN_FILE: ${SOVEREIGN_CONFIG_MANAGER_API_TOKEN_FILE-/run/secrets/manager_api_token}
    secrets:
      - database_url
      - oidc_introspection_client_secret
      - manager_api_token
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sovereign_config_private
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-backend"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.entrypoints=websecure"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.rule=Host(`${SOVEREIGN_CONFIG_HOST:?Set SOVEREIGN_CONFIG_HOST}`)"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.tls=true"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.tls.certresolver=myresolver"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.middlewares=lan-vpn-only@docker,rate-limit@docker,crowdsec@docker,security-headers@docker"
      - "traefik.http.routers.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.service=${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}"
      - "traefik.http.services.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.loadbalancer.server.port=50051"
      - "traefik.http.services.${SOVEREIGN_CONFIG_CONTAINER_NAME:-sovereign-config}.loadbalancer.server.scheme=h2c"
      - "observability.metrics.scrape=true"
      - "observability.metrics.port=9090"
      - "observability.metrics.path=/metrics"
      - "observability.metrics.scheme=http"
      - "observability.service=sovereign-config"
      - "observability.env=${SOVEREIGN_CONFIG_ENV:-dev}"
      - "observability.release=${SOVEREIGN_CONFIG_IMAGE_TAG:-local}"
      - "observability.protocol=v3"
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-/dev/null}
  database_url:
    file: ${DATABASE_URL_FILE:-/dev/null}
  oidc_introspection_client_secret:
    file: ${OIDC_INTROSPECTION_CLIENT_SECRET_FILE:-/dev/null}
  manager_api_token:
    file: ${MANAGER_API_TOKEN_FILE:-/dev/null}

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:?Set POSTGRES_DATA_VOLUME to a pre-created encrypted volume}

networks:
  sovereign_config_private:
    internal: true
  traefik:
    external: true
    name: proxy-backend
