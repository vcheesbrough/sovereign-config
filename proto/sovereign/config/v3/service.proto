syntax = "proto3";

package sovereign.config.v3;

import "google/protobuf/timestamp.proto";

service System {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
}

service Configuration {
  rpc ListValues(ListValuesRequest) returns (ListValuesResponse);
  rpc GetSubTree(GetSubTreeRequest) returns (GetSubTreeResponse);
  rpc PutValue(PutValueRequest) returns (PutValueResponse);
  rpc ReplaceSubTree(ReplaceSubTreeRequest) returns (ReplaceSubTreeResponse);
  rpc DeleteValues(DeleteValuesRequest) returns (DeleteValuesResponse);
  rpc RevealSecret(RevealSecretRequest) returns (RevealSecretResponse);
}

service ManagedConnections {
  rpc ListManagedConnections(ListManagedConnectionsRequest) returns (ListManagedConnectionsResponse);
  rpc CreateManagedConnection(CreateManagedConnectionRequest) returns (CreateManagedConnectionResponse);
  rpc RotateManagedConnection(RotateManagedConnectionRequest) returns (RotateManagedConnectionResponse);
  rpc RevokeManagedConnection(RevokeManagedConnectionRequest) returns (RevokeManagedConnectionResponse);
}

enum ValueClassification {
  VALUE_CLASSIFICATION_UNSPECIFIED = 0;
  VALUE_CLASSIFICATION_PLAIN = 1;
  VALUE_CLASSIFICATION_SECRET = 2;
}

message MaskedSecret {}
message PreserveSecret {}

message ListValuesRequest {
  string path = 1;
}

message ListedValue {
  string path = 1;
  oneof content {
    string plain_value = 2;
    MaskedSecret masked_secret = 5;
  }
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  ValueClassification classification = 6;
}

message ListValuesResponse {
  repeated ListedValue values = 1;
  repeated string paths = 2;
}

message GetSubTreeRequest {
  string path = 1;
}

message SubTreeValue {
  string path = 1;
  oneof content {
    string plain_value = 2;
    MaskedSecret masked_secret = 3;
  }
  ValueClassification classification = 4;
}

message GetSubTreeResponse {
  repeated SubTreeValue values = 1;
}

message PutValueRequest {
  string path = 1;
  oneof content {
    string plain_value = 2;
    string secret_value = 3;
  }
}

message PutValueResponse {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message SubTreeMutationValue {
  string path = 1;
  oneof content {
    string plain_value = 2;
    PreserveSecret preserve_secret = 3;
  }
}

message ReplaceSubTreeRequest {
  string path = 1;
  repeated SubTreeMutationValue values = 2;
}

message ReplaceSubTreeResponse {
  google.protobuf.Timestamp updated_at = 1;
  uint64 value_count = 2;
}

message DeleteValuesRequest {
  string path = 1;
  bool recurse = 2;
}

message DeleteValuesResponse {
  google.protobuf.Timestamp deleted_at = 1;
  uint64 deleted_count = 2;
}

message RevealSecretRequest {
  string path = 1;
}

message RevealSecretResponse {
  string value = 1;
}

enum ManagedConnectionState {
  MANAGED_CONNECTION_STATE_UNSPECIFIED = 0;
  MANAGED_CONNECTION_STATE_PROVISIONING = 1;
  MANAGED_CONNECTION_STATE_ACTIVE = 2;
  MANAGED_CONNECTION_STATE_ROTATION_UNKNOWN = 3;
  MANAGED_CONNECTION_STATE_REVOKING = 4;
  MANAGED_CONNECTION_STATE_CLEANUP_REQUIRED = 5;
}

enum ManagedPermission {
  MANAGED_PERMISSION_UNSPECIFIED = 0;
  MANAGED_PERMISSION_READ = 1;
  MANAGED_PERMISSION_WRITE = 2;
  MANAGED_PERMISSION_MANAGE = 3;
}

message ManagedConnectionMetadata {
  string connection_id = 1;
  string display_name = 2;
  string root = 3;
  ManagedConnectionState state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated ManagedPermission permissions = 7;
}

message ListManagedConnectionsRequest {}

message ListManagedConnectionsResponse {
  repeated ManagedConnectionMetadata connections = 1;
}

message CreateManagedConnectionRequest {
  string display_name = 1;
  string root = 2;
  repeated ManagedPermission permissions = 3;
}

message CreateManagedConnectionResponse {
  ManagedConnectionMetadata metadata = 1;
  string connection_url = 2;
}

message RotateManagedConnectionRequest {
  string connection_id = 1;
}

message RotateManagedConnectionResponse {
  ManagedConnectionMetadata metadata = 1;
  string connection_url = 2;
}

message RevokeManagedConnectionRequest {
  string connection_id = 1;
}

message RevokeManagedConnectionResponse {}

message GetIdentityRequest {}

message GetIdentityResponse {
  bool authenticated = 1;
}

message GetVersionRequest {
  string protocol_version = 1;
}

message GetVersionResponse {
  string application_version = 1;
  string protocol_version = 2;
}
